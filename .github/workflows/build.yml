name: Build mod
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build JAR
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: prestige-modern-ui
          path: build/libs/*.jar
